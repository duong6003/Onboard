<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<!--__FONTS__-->
<style>
:root{
  --brand:__BRAND__;
  --ground:#F4F6F8; --surface:#FFFFFF; --ink:#1E2833; --muted:#5B6773; --line:#DCE1E6; --empty:#E3E8ED;
  --ok:#2E8B7F; --ok-soft:#DCF0EC; --bad:#D9534F; --bad-soft:#F9DFDD;
  --warn:#B97E14; --warn-soft:#F6E8CC; --info:#3E63B8; --info-soft:#E1E8F7;
  --sans:"Be Vietnam Pro","Noto Sans JP",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:Lexend,"Be Vietnam Pro","Noto Sans JP",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#12171D; --surface:#1A2129; --ink:#E6EBF0; --muted:#9AA7B3; --line:#2E3943; --empty:#27313B;
    --ok:#4DB8A9; --ok-soft:#173A35; --bad:#EE7D73; --bad-soft:#43201D;
    --warn:#E2AC52; --warn-soft:#3D2F14; --info:#8FA8EE; --info-soft:#222D4A;
  }
}
:root[data-theme="dark"]{
  --ground:#12171D; --surface:#1A2129; --ink:#E6EBF0; --muted:#9AA7B3; --line:#2E3943; --empty:#27313B;
  --ok:#4DB8A9; --ok-soft:#173A35; --bad:#EE7D73; --bad-soft:#43201D;
  --warn:#E2AC52; --warn-soft:#3D2F14; --info:#8FA8EE; --info-soft:#222D4A;
}
:root:lang(ja){ --display:"Noto Sans JP",Lexend,system-ui,sans-serif; }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.app{max-width:1160px;margin:0 auto;padding:28px 20px 36px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;margin-bottom:16px}
.htext{display:flex;flex-direction:column;gap:2px;min-width:0}
h1{font-family:var(--display);font-size:clamp(21px,2.8vw,28px);line-height:1.25;margin:0;font-weight:700;letter-spacing:-0.01em;display:flex;align-items:center;gap:10px}
h1::before{content:"";flex:none;width:10px;height:10px;border-radius:3px;background:var(--brand)}
.sub{font-size:14px;color:var(--muted)}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:3px;gap:2px}
.langs button{font:inherit;font-size:14px;font-weight:700;padding:6px 12px;border-radius:9px;border:none;background:none;color:var(--muted);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:var(--brand);width:0;transition:width .4s ease}

.stage{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px;min-height:540px}
.text{display:flex;flex-direction:column;gap:14px;min-width:0}
.kicker{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.text h2{font-family:var(--display);font-size:clamp(25px,3vw,36px);line-height:1.2;margin:0;font-weight:700;letter-spacing:-0.015em;overflow-wrap:anywhere}
.text p{margin:0;font-size:18px}
.num{font-variant-numeric:tabular-nums}
.chips{display:flex;flex-direction:column;gap:8px}
.chip{display:flex;gap:10px;align-items:flex-start;font-size:15px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--ink) 5%,var(--surface));border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.chip.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.chip.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.chip .ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;margin-top:1px;background:var(--muted);color:var(--surface)}
.chip.ok .ic{background:var(--ok)} .chip.warn .ic{background:var(--warn)} .chip.bad .ic{background:var(--bad)}
.chip .ic svg{width:12px;height:12px}
.check{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:15px;padding:10px 14px;border-radius:12px;border:1px solid var(--line)}
.check > span:last-child{font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.check.key > span:last-child{background:var(--bad-soft);color:var(--bad)}
.check.warn > span:last-child{background:var(--warn-soft);color:var(--warn)}
.note{font-size:13px;color:var(--muted);padding-left:10px;border-left:3px solid var(--line)}
.note b{color:var(--ink)}

.visual{position:relative;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:16px}
.vis-enter{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.text.enter{animation:rise .4s ease both}
@media (prefers-reduced-motion:reduce){.vis-enter,.text.enter{animation:none}.progress i{transition:none}}
.caption{font-size:13px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;background:var(--empty)}
.sw.s-ok,.gf.s-ok{background:var(--ok)} .sw.s-bad,.gf.s-bad{background:var(--bad)} .sw.s-warn,.gf.s-warn{background:var(--warn)}
.sw.s-info,.gf.s-info{background:var(--info)} .sw.s-muted,.gf.s-muted{background:color-mix(in srgb,var(--ink) 25%,var(--surface))}
.sw.s-empty{background:var(--empty)}
.sw.dot{border-radius:50%}
.sw.ring{background:transparent;border:2px dashed var(--bad);border-radius:50%}

/* grid */
.g{display:flex;flex-direction:column;gap:5px;position:relative}
.g-row{display:grid;grid-template-columns:var(--lab) repeat(var(--nc),minmax(0,1fr));column-gap:4px;align-items:center}
.g-head div{font-size:12px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-lab{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
.gc{position:relative;aspect-ratio:1.25;border-radius:5px;background:var(--empty)}
.gf{position:absolute;inset:0;border-radius:5px;opacity:0}
.g-ov{position:absolute;left:0;right:0;pointer-events:none;display:grid;grid-template-columns:var(--lab) repeat(var(--nc),minmax(0,1fr));column-gap:4px}
.g-box{grid-row:1;border:3px solid var(--bad);border-radius:9px;margin:-6px -4px;transform-origin:50% 0;opacity:0}
.g-area{grid-column:2 / -1;grid-row:1;position:relative}
.g-cur{position:absolute;top:-8px;bottom:-8px;width:4px;margin-left:-2px;border-radius:2px;background:var(--ink);opacity:0}
.g-cur span{position:absolute;bottom:calc(100% + 6px);left:0;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ink);color:var(--surface);white-space:nowrap}

/* timeline */
.tl svg{display:block;width:100%;height:auto;overflow:visible}
.tl text{font-family:var(--sans)}
.tl .t-lab{fill:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.tl .t-head{fill:var(--muted);font-size:13px;font-weight:700;paint-order:stroke;stroke:var(--surface);stroke-width:6px;stroke-linejoin:round}
.tl .pt{fill:var(--surface);stroke:color-mix(in srgb,var(--ink) 30%,transparent);stroke-width:2}
.tl .pt.on{fill:var(--ok);stroke:var(--ok)}
.tl .pt.skip{fill:var(--surface);stroke:var(--bad);stroke-dasharray:3 3}
.tl .xm line{stroke:var(--bad);stroke-width:2.5;stroke-linecap:round}
.tl .t-skip{fill:var(--bad);font-size:13px;font-weight:700}
.tl .lk{stroke:var(--ok);stroke-width:2.5}
.tl .lk.bad{stroke:var(--bad);stroke-dasharray:6 5}
.tl .ah-ok{fill:var(--ok)} .tl .ah-bad{fill:var(--bad)}
.tl .tg{fill:var(--empty)} .tl .tg.s-ok{fill:var(--ok)} .tl .tg.s-bad{fill:var(--bad)} .tl .tg.s-warn{fill:var(--warn)} .tl .tg.s-info{fill:var(--info)}
.tl .tg-t{fill:var(--muted);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums} .tl .tg-t.on{fill:var(--surface)}
.tl .sp{fill:var(--ok-soft);stroke:var(--ok);stroke-width:2}
.tl .sp.bad{fill:var(--bad-soft);stroke:var(--bad)} .tl .sp.warn{fill:var(--warn-soft);stroke:var(--warn)}
.tl .sp-t{fill:var(--ok);font-size:13px;font-weight:700} .tl .sp-t.bad{fill:var(--bad)} .tl .sp-t.warn{fill:var(--warn)}
.tl .ph{stroke:var(--ink);stroke-width:2} .tl .ph-t{fill:var(--ink);font-size:12px;font-weight:700}
.tl .foot{fill:var(--bad);font-size:14px;font-weight:700}

.tl.narrow .t-lab{font-size:21px}.tl.narrow .t-head{font-size:19px}.tl.narrow .tg-t{font-size:19px}
.tl.narrow .t-skip,.tl.narrow .foot{font-size:19px}.tl.narrow .sp-t{font-size:18px}.tl.narrow .ph-t{font-size:18px}
/* bars */
.bars{position:relative;display:flex;flex-direction:column;gap:10px;padding-top:30px}
.b-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center}
.b-name{font-size:14px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.b-name small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.b-track{position:relative;height:28px}
.b-blk,.b-bar{position:absolute;top:0;height:100%;border-radius:5px;background:var(--ok);transform-origin:0 50%}
.b-blk.s-bad,.b-bar.s-bad{background:var(--bad)} .b-blk.s-warn,.b-bar.s-warn{background:var(--warn)} .b-blk.s-info,.b-bar.s-info{background:var(--info)} .b-blk.s-muted,.b-bar.s-muted{background:color-mix(in srgb,var(--ink) 25%,var(--surface))}
.b-lim{position:absolute;top:0;bottom:-6px;left:calc(110px + 12px);right:0;pointer-events:none}
.b-lim i{position:absolute;top:0;bottom:0;border-left:3px dashed var(--bad)}
.b-lim span{position:absolute;top:0;transform:translateX(-50%);font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bad-soft);color:var(--bad);white-space:nowrap}

/* flow */
.fl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 2px 6px}
.fl{position:relative;display:grid;column-gap:var(--cg,24px);row-gap:14px;align-items:center;padding:6px 0}
.fl-lane{font-size:12px;font-weight:700;color:var(--muted);align-self:stretch;display:flex;align-items:center;padding-left:8px;overflow-wrap:break-word;z-index:2}
.fl-band{grid-column:1 / -1;align-self:stretch;border-radius:10px;background:color-mix(in srgb,var(--ink) 3%,var(--surface));margin:-6px 0;z-index:0}
.fl-node{position:relative;z-index:2;justify-self:center;width:100%;max-width:180px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:13px;line-height:1.35;text-align:center;overflow-wrap:break-word;hyphens:auto}
.fl-node small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.fl.dense .fl-node{font-size:12px;padding:7px 6px}.fl.dense .fl-node small{font-size:11px}
.fl-node.s-ok{border-color:var(--ok);background:var(--ok-soft)} .fl-node.s-bad{border-color:var(--bad);background:var(--bad-soft)}
.fl-node.s-warn{border-color:var(--warn);background:var(--warn-soft)} .fl-node.s-info{border-color:var(--info);background:var(--info-soft)}
.fl-node.s-muted{opacity:.55}
.fl-node.hl{box-shadow:0 0 0 4px color-mix(in srgb,var(--ink) 18%,transparent)}
.fl svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:1;pointer-events:none}
.fl .e{fill:none;stroke:color-mix(in srgb,var(--ink) 45%,transparent);stroke-width:2}
.fl .e.s-ok{stroke:var(--ok)} .fl .e.s-bad{stroke:var(--bad);stroke-dasharray:6 5} .fl .e.s-warn{stroke:var(--warn)} .fl .e.s-info{stroke:var(--info)} .fl .e.s-muted{opacity:.4}
.fl-el{position:absolute;z-index:3;font-size:11px;font-weight:700;color:var(--muted);background:var(--surface);padding:1px 5px;border-radius:6px;white-space:nowrap;pointer-events:none}
.fl .ah{fill:color-mix(in srgb,var(--ink) 45%,transparent)} .fl .ah.s-ok{fill:var(--ok)} .fl .ah.s-bad{fill:var(--bad)} .fl .ah.s-warn{fill:var(--warn)} .fl .ah.s-info{fill:var(--info)}

/* compare */
.cmp{display:grid;grid-template-columns:minmax(0,1fr) 32px minmax(0,1fr);gap:10px;align-items:stretch}
.cmp-card{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.cmp-card h3{margin:0 0 2px;font-size:14px;font-weight:700;color:var(--muted)}
.cmp-it{font-size:14px;padding:8px 10px;border-radius:10px;border-left:4px solid var(--line);background:color-mix(in srgb,var(--ink) 4%,var(--surface));display:flex;justify-content:space-between;gap:8px}
.cmp-it em{font-style:normal;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;align-self:flex-start;white-space:nowrap}
.cmp-it.changed{border-left-color:var(--warn)} .cmp-it.changed em{background:var(--warn-soft);color:var(--warn)}
.cmp-it.new{border-left-color:var(--ok)} .cmp-it.new em{background:var(--ok-soft);color:var(--ok)}
.cmp-it.removed{border-left-color:var(--bad)} .cmp-it.removed span{text-decoration:line-through;color:var(--muted)} .cmp-it.removed em{background:var(--bad-soft);color:var(--bad)}
.cmp-arr{display:grid;place-items:center;color:var(--muted)}
.cmp-arr svg{width:24px;height:24px}

/* stats, list, checks */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.stat .k{font-size:14px;color:var(--muted)}
.stat .v{white-space:nowrap;font-family:Lexend,var(--sans);font-size:clamp(32px,4.6vw,50px);font-weight:700;line-height:1.08;font-variant-numeric:tabular-nums}
.stat .n{font-size:13px;color:var(--muted)}
.stats.many .stat .v{font-size:clamp(24px,2.8vw,34px)}
.stat.s-ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 40%,transparent)} .stat.s-ok .v{color:var(--ok)}
.stat.s-bad .v{color:var(--bad)} .stat.s-warn .v{color:var(--warn)} .stat.s-info .v{color:var(--info)}
.lst h3{font-size:15px;margin:0 0 10px;font-weight:700}
.lst ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:n}
.lst li{counter-increment:n;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:15px;padding:10px 12px;border-radius:12px;border:1px solid var(--line)}
.lst li::before{content:counter(n);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--ink);color:var(--surface)}
.lst li small{display:block;color:var(--muted);font-size:13px}
.ck{display:flex;flex-direction:column;gap:8px}

/* nav */
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}
.dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dots button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.dots button[aria-current="step"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dots button.done{background:color-mix(in srgb,var(--brand) 14%,var(--surface));color:var(--ink);border-color:transparent}
.btn{font:inherit;font-weight:700;font-size:15px;padding:11px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.dots button:focus-visible,.langs button:focus-visible,.replay:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 60%,transparent);outline-offset:2px}
.replay{display:inline-flex;align-items:center;gap:6px;margin-top:auto;align-self:flex-start;font:inherit;font-size:14px;font-weight:700;color:var(--muted);background:none;border:none;padding:6px 0;cursor:pointer}
.replay svg{width:16px;height:16px}
.hint{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
footer{font-size:13px;color:var(--muted);text-align:center;margin-top:14px}

@media (max-width:820px){
  .stage{grid-template-columns:1fr;padding:22px 18px;gap:22px;min-height:0}
  .visual{order:-1}
  .text h2{font-size:25px}
  .text p{font-size:16px}
  .nav .btn{padding:10px 14px}
  .dots,.hint{display:none}
  .check{grid-template-columns:1fr;gap:6px}
  .check > span:last-child{justify-self:start;white-space:normal}
  .b-row{grid-template-columns:84px minmax(0,1fr)}
  .b-lim{left:calc(84px + 12px)}
  .cmp{grid-template-columns:1fr}
  .cmp-arr{transform:rotate(90deg);height:24px}
  .fl{column-gap:18px}
  .fl-node{font-size:12px;padding:8px}
}
/* ---------- v1.2: styles ---------- */
body[data-style="dark"]{
  --ground:#0F141A; --surface:#161D25; --ink:#E8EDF2; --muted:#93A1AE; --line:#2A3540; --empty:#24303B;
  --ok:#4DB8A9; --ok-soft:#163A35; --bad:#EE7D73; --bad-soft:#41201D; --warn:#E2AC52; --warn-soft:#3B2E14; --info:#8FA8EE; --info-soft:#212C48;
}
body[data-style="sketch"]{
  --ground:#FBF8F1; --surface:#FFFDF7; --ink:#2A2A2A; --muted:#6B6558; --line:#CFC7B4; --empty:#ECE6D8;
  --ok:#2E8B7F; --ok-soft:#DCF0EC; --bad:#C9483F; --bad-soft:#F7DEDA; --warn:#B47A12; --warn-soft:#F5E6C6; --info:#3E63B8; --info-soft:#E1E8F7;
  --display:"Patrick Hand","Be Vietnam Pro","Noto Sans JP",system-ui,sans-serif;
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 10%,transparent) 1px,transparent 1px);background-size:22px 22px;
}
body[data-style="sketch"] .stage,body[data-style="sketch"] .chip,body[data-style="sketch"] .check,body[data-style="sketch"] .fl-node,
body[data-style="sketch"] .cmp-card,body[data-style="sketch"] .stat,body[data-style="sketch"] .lst li,body[data-style="sketch"] .card,
body[data-style="sketch"] .calc-box,body[data-style="sketch"] .qz-opt{border-radius:255px 18px 225px 18px / 18px 225px 18px 255px;border-width:2px;border-color:color-mix(in srgb,var(--ink) 50%,transparent)}
body[data-style="sketch"] .text h2,body[data-style="sketch"] h1,body[data-style="sketch"] .card h3{font-family:var(--display);font-weight:400;letter-spacing:0}
body[data-style="sketch"] .text h2{font-size:clamp(30px,3.6vw,44px)}
body[data-style="editorial"]{ --display:"Playfair Display",Georgia,"Noto Serif JP",serif; }
body[data-style="editorial"] .stage{border:none;border-top:3px solid var(--ink);border-radius:0;background:transparent;padding:28px 0}
body[data-style="editorial"] .text h2{font-size:clamp(30px,3.8vw,48px);letter-spacing:-0.005em}
body[data-style="editorial"] .kicker{color:var(--brand);text-transform:uppercase;letter-spacing:.14em}
body[data-style="editorial"] h1{font-family:var(--display)} body[data-style="editorial"] h1::before{display:none}
body[data-style="editorial"] .chip{background:transparent;border:none;border-left:3px solid var(--line);border-radius:0;padding:4px 12px}
body[data-style="editorial"] .chip .ic{display:none}
body[data-style="editorial"] .card{border:none;border-top:2px solid var(--ink);border-radius:0;background:transparent}

/* ---------- v1.2: per-step layout ---------- */
.stage.l-hero{grid-template-columns:1fr;gap:20px}
.stage.l-hero .visual{order:-1}
.stage.l-hero .text h2{font-size:clamp(23px,2.6vw,30px)}
.stage.l-hero .tl svg,.stage.l-hero .sq svg{max-height:50vh}
.stage.l-hero .visual{max-width:980px;margin:0 auto;width:100%}
.stage.l-center{grid-template-columns:1fr;gap:18px}

#list.onepage{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card .visual{min-height:0}
.card .text{gap:8px}
.card h3{font-family:var(--display);font-size:19px;line-height:1.3;margin:0}
.card .text p{font-size:15px}
.card .chips .chip{font-size:13px;padding:7px 10px}
.card .cmp{grid-template-columns:1fr} .card .cmp-arr{transform:rotate(90deg);height:24px}
.card .check{grid-template-columns:1fr;gap:6px} .card .check > span:last-child{justify-self:start;white-space:normal}
.card .b-row{grid-template-columns:84px minmax(0,1fr)} .card .b-lim{left:calc(84px + 12px)}
.play{display:inline-flex;align-items:center;gap:6px}

.mx{display:grid;gap:4px;align-items:stretch}

.mx .mx-h{font-weight:700;background:color-mix(in srgb,var(--ink) 6%,var(--surface));text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}

.mx .mx-c{background:color-mix(in srgb,var(--ink) 4%,var(--surface))}
.mx-cards{display:none;flex-direction:column;gap:10px}

.mx-card h4{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}

.fl-node.cur{box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 35%,transparent)}

  var text = $('text'), vis = $('visual');
  $('stage').className = 'stage' + layoutClass(step);
  text.classList.remove('enter'); vis.classList.remove('vis-enter'); void text.offsetWidth; text.classList.add('enter'); vis.classList.add('vis-enter');
  var sec = new Section(step, text, vis, false); sec.build(); sections = [sec];
  $('prog').style.width = ((step + 1) / STEPS.length * 100) + '%';
  Array.prototype.forEach.call($('dots').children, function(b, j){
    if (j === step) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    b.classList.toggle('done', j < step);
  });

  $('next').textContent = step === STEPS.length - 1 ? U('restart') : U('next');
  cancelAnimationFrame(raf); raf = 0; sec.start(); schedule();
}

/* scroll & onepage */
var io = null;
function buildList(){
  var list = $('list'); list.innerHTML = ''; list.className = FORMAT === 'onepage' ? 'onepage' : '';
  if (io) io.disconnect();
  sections = STEPS.map(function(s, i){
    var wrap, textEl, visEl;
    if (FORMAT === 'onepage'){ wrap = mk('article', 'card'); visEl = mk('div', 'visual'); textEl = mk('div', 'text'); wrap.appendChild(visEl); wrap.appendChild(textEl); }
    else { wrap = mk('section', 'stage' + layoutClass(i)); textEl = mk('div', 'text'); visEl = mk('div', 'visual'); wrap.appendChild(textEl); wrap.appendChild(visEl); }
    wrap.setAttribute('data-step', i); list.appendChild(wrap);
    var sec = new Section(i, textEl, visEl, FORMAT === 'onepage'); sec.build(); return sec;
  });
  if (FORMAT === 'onepage'){ sections.forEach(function(s, i){ s.start(i * .15); }); }
  else if ('IntersectionObserver' in window){
    io = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting){ var s = sections[+e.target.getAttribute('data-step')]; if (s && !s.started) s.start(); } }); }, { threshold: .35 });
    Array.prototype.forEach.call(list.children, function(c){ io.observe(c); });
  } else sections.forEach(function(s){ s.start(); });
  kick();
}
function onScroll(){
  if (FORMAT !== 'scroll') return;
  var h = document.documentElement, p = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight);
  $('prog').style.width = (clamp(p) * 100) + '%';
}

function applyStatic(){
  document.documentElement.lang = lang;
  var meta = STORY.meta || {};
  document.title = T(meta.title);
  $('h1').innerHTML = RT(meta.title); $('sub').innerHTML = RT(meta.subtitle || ''); $('foot').innerHTML = RT(meta.footer || '');
  $('prev').textContent = U('prev'); $('hint').textContent = U('hint');
  $('nav').setAttribute('aria-label', U('nav'));
  var lg = $('langs'); lg.setAttribute('aria-label', U('lang')); lg.innerHTML = '';
  if (LANGS.length < 2) lg.style.display = 'none';
  LANGS.forEach(function(l){
    var b = mk('button', '', esc(LANG_NAMES[l] || l.toUpperCase())); b.type = 'button';
    b.setAttribute('aria-pressed', l === lang ? 'true' : 'false');
    b.addEventListener('click', function(){ setLang(l); }); lg.appendChild(b);
  });
  var dots = $('dots'); dots.innerHTML = '';
  if (FORMAT === 'stepper' && STORY.autoplay && !reduce){
    var pb = mk('button', 'btn play', ''); pb.id = 'playbtn'; pb.type = 'button';
    pb.innerHTML = auto ? PAUSEI + esc(U('pause')) : PLAYI + esc(U('play'));
    pb.setAttribute('aria-pressed', auto ? 'true' : 'false');
    pb.addEventListener('click', function(){ if (auto) stopAuto(); else { auto = true; pb.innerHTML = PAUSEI + esc(U('pause')); pb.setAttribute('aria-pressed', 'true'); if (step === STEPS.length - 1) go(0, true); else schedule(); } });
    dots.appendChild(pb);
  }
  STEPS.forEach(function(s, i){
    var b = mk('button', '', String(i + 1)); b.type = 'button';
    b.setAttribute('aria-label', U('step') + ' ' + (i + 1) + ': ' + T(s.title).replace('{count}', s.count ? String(s.count.to) : '').replace(/<[^>]+>/g, ''));
    b.addEventListener('click', function(){ go(i); }); dots.appendChild(b);
  });
}
function render(){ if (FORMAT === 'stepper') go(step, auto); else buildList(); }
function setLang(l){
  if (LANGS.indexOf(l) < 0) return;
  lang = l;
  try { if (storageKey) localStorage.setItem(storageKey, l); } catch (e) {}
  applyStatic(); render();
}
$('prev').addEventListener('click', function(){ go(step - 1); });
$('next').addEventListener('click', function(){ go(step === STEPS.length - 1 ? 0 : step + 1); });
document.addEventListener('keydown', function(e){
  if (FORMAT !== 'stepper' || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight' && step < STEPS.length - 1){ e.preventDefault(); go(step + 1); }
  if (e.key === 'ArrowLeft' && step > 0){ e.preventDefault(); go(step - 1); }
});
window.addEventListener('scroll', onScroll, { passive: true });
function refresh(){ sections.forEach(function(s){ s.relayout(); }); var now = performance.now(); sections.forEach(function(s){ s.render(now); }); kick(); }
var rz = 0;
window.addEventListener('resize', function(){ clearTimeout(rz); rz = setTimeout(refresh, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(refresh);
window.__onboard = {
  go: function(i){ if (FORMAT === 'stepper') return go(i); var s = sections[i]; if (!s) return; s.visEl.parentNode.scrollIntoView({ block: 'start' }); if (!s.started) s.start(); kick(); },
  setLang: setLang, count: STEPS.length, langs: LANGS, format: FORMAT, style: STYLE,
  step: function(){ return step; }, visual: function(i){ return FORMAT === 'stepper' ? $('visual') : (sections[i] && sections[i].visEl); }
};
applyStatic(); render();
})();

</script>
